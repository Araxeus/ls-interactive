name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-unknown-linux-musl
            os: ubuntu-latest
            targets: x86_64-unknown-linux-musl
            legacy: linux
          - name: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-musl
          - name: universal-apple-darwin
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            legacy: macos
          - name: x86_64-pc-windows-msvc
            os: windows-latest
            targets: x86_64-pc-windows-msvc
            legacy: windows
          - name: aarch64-pc-windows-msvc
            os: windows-11-arm
            targets: aarch64-pc-windows-msvc

    env:
      NAME: ${{ matrix.name }}
      LEGACY: ${{ matrix.legacy }}
      EXT: ${{ contains(matrix.name, 'windows') && 'zip' || 'tar.gz' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install nightly --profile minimal --target ${{ matrix.targets }} && rustup default nightly

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.name }}

      - name: Install musl tools
        if: contains(matrix.name, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        shell: bash
        env:
          TARGETS: ${{ matrix.targets }}
          RUSTFLAGS: ${{ contains(matrix.name, 'musl') && '-C target-feature=+crt-static' || '' }}
        run: |
          for target in ${TARGETS//,/ }; do
            cargo build --release --verbose --target "$target"
          done

      # Mac ships one universal binary that runs on Apple Silicon and Intel

      - name: Stage binary
        shell: bash
        run: |
          mkdir dist
          case "$NAME" in
            universal-apple-darwin)
              lipo -create -output dist/ls-interactive \
                target/aarch64-apple-darwin/release/ls-interactive \
                target/x86_64-apple-darwin/release/ls-interactive
              lipo dist/ls-interactive -verify_arch arm64 x86_64
              ;;
            *windows*)
              cp "target/$NAME/release/ls-interactive.exe" dist/
              ;;
            *)
              cp "target/$NAME/release/ls-interactive" dist/
              ;;
          esac

      # Fails if a dependency starts linking a shared C library

      - name: Verify static linking
        if: contains(matrix.name, 'musl')
        run: |
          file dist/ls-interactive
          file dist/ls-interactive | grep -Eq 'statically linked|static-pie linked'

      - name: Smoke test
        shell: bash
        run: |
          bin=dist/ls-interactive
          [[ -f $bin.exe ]] && bin=$bin.exe
          expected=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          output=$("$bin" --version)
          echo "$output"
          [[ $output == *"$expected"* ]]

      - name: Get filenames
        id: filename
        shell: bash
        run: |
          tag=${GITHUB_REF#refs/tags/}
          echo "FILENAME=lsi_${tag}_${NAME}.${EXT}" >> "$GITHUB_OUTPUT"
          [[ -n $LEGACY ]] && echo "LEGACY_FILENAME=lsi_${tag}_${LEGACY}.${EXT}" >> "$GITHUB_OUTPUT"
          true

      - name: Tar (Unix)
        if: runner.os != 'Windows'
        run: ${{ runner.os == 'macOS' && 'gtar' || 'tar' }} cvzf ${{ steps.filename.outputs.FILENAME }} -C scripts lsi.sh -C ../dist ls-interactive

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/ls-interactive.exe, scripts/lsi.bat ${{ steps.filename.outputs.FILENAME }} -Force

      # Old asset names (linux/macos/windows) keep existing download links working

      - name: Copy to legacy filename
        if: steps.filename.outputs.LEGACY_FILENAME
        shell: bash
        run: cp "${{ steps.filename.outputs.FILENAME }}" "${{ steps.filename.outputs.LEGACY_FILENAME }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: lsi_*.${{ env.EXT }}
          if-no-files-found: error

  # Releases are immutable once published, so assets go into a draft that is published by hand

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber
