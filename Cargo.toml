[package]
name = "ls-interactive"
description = "Interactive ls command"
version = "1.8.0"
authors = ["Araxeus <oaeben@gmail.com>"]
license = "MIT"
edition = "2021"
readme = "README.md"
repository = "https://github.com/Araxeus/ls-interactive"
keywords = ["ls", "lsi", "cli", "files", "folders"]
categories = ["command-line-utilities"]

[[bin]]
name = "ls-interactive"
path = "src/main.rs"

[dependencies]
console = "0.16.6"
open = "5.4.5"
human-panic = "2.0.8"
lnk = "0.6.4"
encoding_rs = "0.8.44"
fuzzy-matcher = "0.3.7"
crossterm = "0.29.0"
unicode-segmentation = "1.13.3"
cached = "4.0.3"
unicode-width = "0.2.3"
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_Console"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
vt100 = "0.18.1"
